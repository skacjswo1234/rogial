<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>문의하기 | 로지알</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./styles.css" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { paperlogy: ['Paperlogy', 'sans-serif'] },
          colors: {
            primary: { 50: '#fff7ed', 100: '#ffedd5', 200: '#fed7aa', 300: '#fdba74', 400: '#fb923c', 500: '#f97316', 600: '#ea580c', 700: '#c2410c', 800: '#9a3412', 900: '#7c2d12' },
            accent: { 50: '#eff6ff', 100: '#dbeafe', 200: '#bfdbfe', 300: '#93c5fd', 400: '#60a5fa', 500: '#3b82f6', 600: '#2563eb' },
          },
          boxShadow: { glow: '0 10px 50px rgba(249, 115, 22, 0.25)' },
        },
      },
    };
  </script>
</head>
<body class="bg-gray-50 font-paperlogy antialiased">
  <nav class="bg-white border-b border-gray-200">
    <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2">
        <img src="./logo.PNG" alt="로지알" class="w-10 h-10 rounded-full object-contain" />
        <span class="font-bold text-gray-800">(주)로지알</span>
      </a>
    </div>
  </nav>

  <main class="max-w-5xl mx-auto px-4 py-12">
    <h1 class="text-2xl md:text-3xl font-black text-gray-900 mb-2">문의하기</h1>
    <p class="text-gray-600 mb-8">입력해 주신 내용은 담당자가 확인 후 연락드립니다.</p>

    <div id="form-message" class="hidden mb-6 p-4 rounded-xl text-sm font-medium"></div>


    <div class="grid md:grid-cols-2 gap-8">
      <div class="space-y-4">
        <div class="p-4 rounded-2xl bg-gradient-to-br from-primary-500 to-accent-600 text-white shadow-lg">
          <p class="text-sm uppercase tracking-widest text-white/90 font-bold">상담 시간</p>
          <p class="text-white/90 font-semibold mt-2">10:00 ~ 20:00(연중무휴)</p>
        </div>
        <div class="p-4 rounded-2xl bg-gradient-to-br from-primary-500 to-accent-600 text-white shadow-lg">
          <p class="text-sm text-white/90 mb-2">📦 재료 무료 배송 · 완성품 수거</p>
          <p class="text-sm text-white/90 mb-2">💳 검수 후 계좌로 안전 정산</p>
          <p class="text-sm text-white/90">📞 담당자 1:1 안내</p>
        </div>
      </div>

      <form id="inquiry-form" class="space-y-4 bg-white p-6 rounded-2xl shadow-xl border border-gray-200">
      <input type="text" name="name" placeholder="성함" required
        class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-all" />
      <input type="tel" name="phone" placeholder="연락처" required
        class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-all" />
      <input type="text" name="region" placeholder="거주 지역" required
        class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-all" />
      <select name="work-type" required
        class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 text-gray-800 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-all">
        <option value="">신청 재료 (작업 종류) 선택</option>
        <option value="장난감부품버클캡">🧸 장난감 부품 버클캡 (단가 100원)</option>
        <option value="폰케이스스티커">📱 폰케이스 스티커 (단가 1,000원)</option>
        <option value="단추부자재">⚪ 단추부자재 (단가 300원)</option>
        <option value="머리핀">🎀 머리핀 (단가 200원)</option>
        <option value="커넥터">🦋 커넥터 (단가 400원)</option>
        <option value="꽃꽂이">🌸 꽃꽂이 (단가 200원)</option>
        <option value="열쇠고리">🔐 열쇠고리 (단가 200원)</option>
        <option value="스티커">🌈 스티커 (단가 100원)</option>
      </select>
      <input type="number" name="min-quantity" placeholder="최소 수량 (개)" min="1"
        class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-all" />
      <textarea name="message" rows="4" placeholder="문의 내용 (가능 시간대 등)"
        class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-all resize-none"></textarea>
      <div class="flex items-start gap-2 text-sm text-gray-700">
        <input type="checkbox" id="privacy" required class="mt-1 w-4 h-4 text-primary-600 border-gray-300 rounded focus:ring-primary-500" />
        <label for="privacy">개인정보 수집 및 이용에 동의합니다. 입력해 주신 정보는 부업 안내 및 상담, 작업 배정 안내 목적에만 사용되며 제3자에게 판매·공유되지 않습니다.</label>
      </div>
      <button type="submit"
        class="w-full px-5 py-3 rounded-xl bg-gradient-to-r from-primary-500 to-primary-600 text-white font-black shadow-lg hover:shadow-xl hover:-translate-y-0.5 transition-all">
        무료 상담·신청하기
      </button>
    </form>
    </div>
  </main>

  <script>
    (function() {
      var form = document.getElementById('inquiry-form');
      var msgEl = document.getElementById('form-message');

      function showMessage(text, isError) {
        msgEl.textContent = text;
        msgEl.className = 'mb-6 p-4 rounded-xl text-sm font-medium ' + (isError ? 'bg-red-100 text-red-800' : 'bg-green-100 text-green-800');
        msgEl.classList.remove('hidden');
      }

      var workInfo = {
        '장난감부품버클캡': { name: '장난감 부품 버클캡', price: 100, quantity: '1,000-5,000', description: '장난감 부품의 버클 캡을 조립하는 단순 작업입니다. 작업 난이도가 비교적 낮아 처음 시작하시는 분께 추천드립니다.', recommended: 3000, estimated: 300000 },
        '폰케이스스티커': { name: '폰케이스 스티커', price: 1000, quantity: '500-3,000', description: '폰케이스에 스티커를 부착하는 작업입니다. 세심함이 필요한 작업으로 단가가 높은 편입니다.', recommended: 1000, estimated: 1000000 },
        '단추부자재': { name: '단추부자재', price: 300, quantity: '1,000-3,000', description: '단추와 부자재를 조립하는 작업입니다. 규칙적인 패턴으로 진행할 수 있어 리듬감 있게 작업하실 수 있습니다.', recommended: 2000, estimated: 600000 },
        '머리핀': { name: '머리핀', price: 200, quantity: '1,000-3,000', description: '머리핀을 제작하는 작업입니다. 작은 부품을 다루는 작업으로 집중력이 필요합니다.', recommended: 2000, estimated: 400000 },
        '커넥터': { name: '커넥터', price: 400, quantity: '500-2,000', description: '커넥터를 조립하는 작업입니다. 정확한 위치에 부품을 결합하는 작업으로 세심함이 필요합니다.', recommended: 1000, estimated: 400000 },
        '꽃꽂이': { name: '꽃꽂이', price: 200, quantity: '1,000-3,000', description: '꽃꽂이를 만드는 작업입니다. 아름다운 디자인으로 제작하는 창의적인 작업입니다.', recommended: 2000, estimated: 400000 },
        '열쇠고리': { name: '열쇠고리', price: 200, quantity: '1,000-3,000', description: '열쇠고리를 제작하는 작업입니다. 다양한 디자인의 열쇠고리를 만드는 작업입니다.', recommended: 2000, estimated: 400000 },
        '스티커': { name: '스티커', price: 100, quantity: '5,000-10,000', description: '스티커를 포장하거나 부착하는 작업입니다. 난이도가 가장 낮아서 처음 해보시는 분들께 인기가 많습니다.', recommended: 7000, estimated: 700000 }
      };

      form.addEventListener('submit', async function(e) {
        e.preventDefault();
        var data = new FormData(form);
        var payload = {
          name: data.get('name'),
          phone: data.get('phone'),
          region: data.get('region'),
          workType: data.get('work-type'),
          minQuantity: data.get('min-quantity') ? parseInt(data.get('min-quantity'), 10) : null,
          message: data.get('message')
        };
        var btn = form.querySelector('button[type="submit"]');
        var origText = btn.textContent;
        btn.disabled = true;
        btn.textContent = '전송 중...';
        try {
          var response = await fetch('/api/inquiries', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          var result = await response.json();
          if (response.ok && result.success) {
            var selectedWork = workInfo[payload.workType] || {
              name: payload.workType,
              price: 0,
              quantity: '-',
              description: '선택하신 작업에 대한 상세 안내는 담당자가 개별 상담 시 안내해 드립니다.',
              recommended: 0,
              estimated: 0
            };
            var modal = document.createElement('div');
            modal.className = 'fixed inset-0 bg-gray-600/50 flex items-center justify-center z-50 p-4';
            modal.innerHTML = '<div class="bg-white rounded-lg shadow-2xl max-w-lg w-full max-h-[90vh] overflow-y-auto relative">' +
              '<button type="button" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 transition-colors z-10">' +
              '<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>' +
              '<div class="p-6">' +
              '<div class="flex items-center gap-2 mb-4"><span class="text-xl">📦</span><h3 class="text-base font-semibold text-gray-900">수공예 재료 택배 신청서 (미리보기)</h3></div>' +
              '<p class="text-lg font-bold text-gray-900 mb-6">' + selectedWork.name + ' 신청이 접수되었습니다</p>' +
              '<div class="space-y-3 mb-6 border-b border-gray-200 pb-6">' +
              '<div class="flex justify-between items-start"><span class="text-gray-600 text-sm">신청자</span><span class="text-gray-900 font-medium text-right">' + (payload.name || '') + '</span></div>' +
              '<div class="flex justify-between items-start"><span class="text-gray-600 text-sm">연락처</span><span class="text-gray-900 font-medium text-right">' + (payload.phone || '') + '</span></div>' +
              '<div class="flex justify-between items-start"><span class="text-gray-600 text-sm">배송지</span><span class="text-gray-900 font-medium text-right">' + (payload.region || '') + '</span></div>' +
              '<div class="flex justify-between items-start"><span class="text-gray-600 text-sm">신청 재료</span><span class="text-gray-900 font-medium text-right">' + selectedWork.name + ' (단가 ' + (selectedWork.price ? selectedWork.price.toLocaleString() : '-') + '원)</span></div>' +
              (payload.minQuantity ? '<div class="flex justify-between items-start"><span class="text-gray-600 text-sm">최소 수량</span><span class="text-gray-900 font-medium text-right">' + payload.minQuantity + '개</span></div>' : '') +
              '</div>' +
              '<p class="text-gray-700 mb-6 leading-relaxed text-sm">' + (selectedWork.description || '') + '</p>' +
              '<div class="mb-6">' +
              '<p class="text-gray-700 mb-2 text-sm">단가 <span class="font-bold text-primary-600">' + (selectedWork.price ? selectedWork.price.toLocaleString() : '-') + '원</span> - 신입 추천 수량 <span class="font-bold text-primary-600">' + (selectedWork.recommended ? selectedWork.recommended.toLocaleString() : '-') + '개</span></p>' +
              '<p class="text-gray-700 text-sm">예상 총 정산 급여 약 <span class="font-bold text-primary-600">' + (selectedWork.estimated ? Math.floor(selectedWork.estimated / 10000) + '만원' : '-') + '</span> (예시)</p>' +
              '</div>' +
              '<p class="text-xs text-gray-500 leading-relaxed mb-4">* 위 내용은 온라인 신청서를 기반으로 자동 생성된 미리보기이며, 실제 배정 전 담당자가 전화·카톡 상담을 통해 수량·일정·단가를 한 번 더 확인해 드립니다.</p>' +
              '<button type="button" id="inquiry-modal-close-btn" class="w-full px-5 py-3 rounded-lg bg-gradient-to-r from-primary-500 to-primary-600 text-white font-bold hover:shadow-lg transition-all">확인</button>' +
              '</div></div>';
            document.body.appendChild(modal);
            function closeModal() {
              modal.remove();
              form.reset();
              btn.disabled = false;
              btn.textContent = origText;
            }
            modal.querySelector('button[type="button"]').addEventListener('click', closeModal);
            modal.querySelector('#inquiry-modal-close-btn').addEventListener('click', closeModal);
            modal.addEventListener('click', function(ev) { if (ev.target === modal) closeModal(); });
          } else {
            showMessage(result.error || '전송에 실패했습니다.', true);
            btn.disabled = false;
            btn.textContent = origText;
          }
        } catch (err) {
          showMessage('네트워크 오류가 발생했습니다.', true);
          btn.disabled = false;
          btn.textContent = origText;
        }
      });
    })();
  </script>
</body>
</html>
